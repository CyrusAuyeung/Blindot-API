name: ${COMPOSE_PROJECT_NAME:-sub2api-deploy}

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-50m}"
    max-file: "${DOCKER_LOG_MAX_FILES:-5}"

x-default-ulimits: &default-ulimits
  nofile:
    soft: 100000
    hard: 100000

services:
  sub2api:
    image: ${SUB2API_IMAGE:-weishaw/sub2api:0.1.163@sha256:ac3013098153fd276e7fb0723bbb7032f290e1de018dd7b21a238c298064ff5d}
    container_name: sub2api
    labels:
      org.blindot.deploy.config-version: ${BLINDOT_DEPLOY_CONFIG_VERSION:?Set BLINDOT_DEPLOY_CONFIG_VERSION=2 after reviewing the v2 migration guide}
      org.blindot.runtime-layout-version: ${BLINDOT_RUNTIME_LAYOUT_VERSION:?Preserve the current executable, then set BLINDOT_RUNTIME_LAYOUT_VERSION=1 per docs/runtime-image-sync.md}
      org.blindot.runtime-binary: /app/runtime/sub2api
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    ulimits: *default-ulimits
    logging: *default-logging
    env_file:
      - ./.env
    ports:
      # Keep the application behind the local reverse proxy by default.
      - "${BIND_HOST:-127.0.0.1}:${SERVER_PORT:-8080}:8080"
    entrypoint: ["/app/blindot-runtime-entrypoint.sh"]
    command: ["/app/runtime/sub2api"]
    volumes:
      - ./data:/app/data
      # Keep web-console binary updates outside the container writable layer.
      - ./runtime:/app/runtime
      - ./scripts/sub2api-runtime-entrypoint.sh:/app/blindot-runtime-entrypoint.sh:ro
      # Optional custom application configuration:
      # - ./config.yaml:/app/data/config.yaml:ro
    environment:
      AUTO_SETUP: "true"
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      SERVER_MODE: ${SERVER_MODE:-release}
      RUN_MODE: ${RUN_MODE:-standard}

      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-sub2api}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DATABASE_DBNAME: ${POSTGRES_DB:-sub2api}
      DATABASE_SSLMODE: disable
      DATABASE_MAX_OPEN_CONNS: ${DATABASE_MAX_OPEN_CONNS:-80}
      DATABASE_MAX_IDLE_CONNS: ${DATABASE_MAX_IDLE_CONNS:-20}
      DATABASE_CONN_MAX_LIFETIME_MINUTES: ${DATABASE_CONN_MAX_LIFETIME_MINUTES:-30}
      DATABASE_CONN_MAX_IDLE_TIME_MINUTES: ${DATABASE_CONN_MAX_IDLE_TIME_MINUTES:-5}

      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_POOL_SIZE: ${REDIS_POOL_SIZE:-4096}
      REDIS_MIN_IDLE_CONNS: ${REDIS_MIN_IDLE_CONNS:-256}
      REDIS_ENABLE_TLS: ${REDIS_ENABLE_TLS:-false}

      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRE_HOUR: ${JWT_EXPIRE_HOUR:-24}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:-}
      TZ: ${TZ:-Asia/Shanghai}

      GEMINI_OAUTH_CLIENT_ID: ${GEMINI_OAUTH_CLIENT_ID:-}
      GEMINI_OAUTH_CLIENT_SECRET: ${GEMINI_OAUTH_CLIENT_SECRET:-}
      GEMINI_OAUTH_SCOPES: ${GEMINI_OAUTH_SCOPES:-}
      GEMINI_QUOTA_POLICY: ${GEMINI_QUOTA_POLICY:-}
      GEMINI_CLI_OAUTH_CLIENT_SECRET: ${GEMINI_CLI_OAUTH_CLIENT_SECRET:-}
      ANTIGRAVITY_OAUTH_CLIENT_SECRET: ${ANTIGRAVITY_OAUTH_CLIENT_SECRET:-}

      SECURITY_URL_ALLOWLIST_ENABLED: ${SECURITY_URL_ALLOWLIST_ENABLED:-false}
      SECURITY_URL_ALLOWLIST_ALLOW_INSECURE_HTTP: ${SECURITY_URL_ALLOWLIST_ALLOW_INSECURE_HTTP:-false}
      SECURITY_URL_ALLOWLIST_ALLOW_PRIVATE_HOSTS: ${SECURITY_URL_ALLOWLIST_ALLOW_PRIVATE_HOSTS:-false}
      SECURITY_URL_ALLOWLIST_UPSTREAM_HOSTS: ${SECURITY_URL_ALLOWLIST_UPSTREAM_HOSTS:-}
      UPDATE_PROXY_URL: ${UPDATE_PROXY_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sub2api-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18-alpine}
    container_name: sub2api-postgres
    restart: unless-stopped
    stop_grace_period: 60s
    shm_size: ${POSTGRES_SHM_SIZE:-256mb}
    ulimits: *default-ulimits
    logging: *default-logging
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sub2api}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-sub2api}
      PGDATA: /var/lib/postgresql/data
      TZ: ${TZ:-Asia/Shanghai}
    networks:
      - sub2api-network
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -p 5432 -U ${POSTGRES_USER:-sub2api} -d ${POSTGRES_DB:-sub2api}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: ${REDIS_IMAGE:-redis:8-alpine}
    container_name: sub2api-redis
    restart: unless-stopped
    stop_grace_period: 30s
    ulimits: *default-ulimits
    logging: *default-logging
    volumes:
      - ./redis_data:/data
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_MAXCLIENTS: ${REDIS_MAXCLIENTS:-10000}
      REDISCLI_AUTH: ${REDIS_PASSWORD:-}
    command:
      - sh
      - -ec
      - |
        set -- redis-server \
          --port "$${REDIS_PORT:-6379}" \
          --save 60 1 \
          --appendonly yes \
          --appendfsync everysec \
          --maxclients "$${REDIS_MAXCLIENTS:-10000}"
        if [ -n "$${REDIS_PASSWORD:-}" ]; then
          set -- "$$@" --requirepass "$$REDIS_PASSWORD"
        fi
        exec "$$@"
    networks:
      - sub2api-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -h 127.0.0.1 -p $${REDIS_PORT:-6379} ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  sub2api-network:
    driver: bridge
